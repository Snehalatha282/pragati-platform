<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragati - Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-venus-double" style="color: #9b51e0;"></i>
            <span class="logo-text">Pragati Admin</span>
        </div>

        <div class="admin-profile">
            <div class="admin-avatar">
                <!-- Fallback to placeholder if no profile picture -->
                <img src="{{ current_user.profile_picture or url_for('static', filename='images/avatar-placeholder.png') }}"
                    alt="Admin">
            </div>
            <div class="admin-info">
                <h4>{{ current_user.first_name }}</h4>
                <span>Administrator</span>
            </div>
        </div>

        <ul class="sidebar-nav">
            <li class="nav-item">
                <a href="{{ url_for('admin.dashboard') }}" class="active">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="#">
                    <i class="fas fa-users"></i> Users
                </a>
            </li>
            <li class="nav-item">
                <a href="#">
                    <i class="fas fa-briefcase"></i> Job Listings
                </a>
            </li>
            <li class="nav-item">
                <a href="#">
                    <i class="fas fa-graduation-cap"></i> Courses
                </a>
            </li>
            <li class="nav-item">
                <a href="#">
                    <i class="fas fa-chalkboard-teacher"></i> Mentors
                </a>
            </li>
            <li class="nav-item">
                <a href="#">
                    <i class="fas fa-comments"></i> Community
                </a>
            </li>
            <li class="nav-item">
                <a href="#">
                    <i class="fas fa-cog"></i> Settings
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="brand-logo">
                <i class="fa-solid fa-venus"></i> Pragati
            </div>
            <div class="header-actions">
                <a href="#" class="header-link">
                    <i class="fas fa-user-shield"></i> Admin Panel
                </a>
                <a href="{{ url_for('auth.logout') }}" class="header-link">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>

</html>
